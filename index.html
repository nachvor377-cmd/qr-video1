<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video & Audio</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
      background: #f7f7f7;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 16px;
    }

    video {
      width: 100%;
      border-radius: 10px;
    }

    audio {
      width: 100%;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Video & Audio</h1>

  <p>Video ansehen:</p>

  <video controls>
    <source src="video.mp4" type="video/mp4">
    Dein Browser unterstützt dieses Video nicht.
  </video>

  <p>Audio anhören:</p>

  <audio controls>
    <source src="audio.mp3" type="audio/mpeg">
    Dein Browser unterstützt diese Audiodatei nicht.
  </audio>

</div>

</body>
</html>
